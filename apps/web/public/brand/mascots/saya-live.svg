" cy="32" rx="46" ry="30" fill="url(#saya-R0h)"></ellipse><ellipse cx="50" cy="104" rx="66" ry="30" fill="url(#saya-R0d)"></ellipse><path d="M41 24H59a27 27 0 0 1 27 27V63a27 27 0 0 1 -27 27H41a27 27 0 0 1 -27 -27V51a27 27 0 0 1 27 -27Z" fill="none" stroke="#fff" stroke-opacity="0.32" stroke-width="1.6"></path></g><rect x="21.5" y="34" width="57" height="45.4" rx="19.5" fill="#6d5dad" opacity="0.7"></rect><rect x="23" y="35" width="54" height="42" rx="18" fill="url(#saya-R0v)"></rect><path d="M35.96 38.6H51.08Q44.6 47.6 27.6 52.64Q25.6 43 35.96 38.6Z" fill="#fff" opacity="0.1"></path><ellipse cx="29.5" cy="65.5" rx="4.4" ry="2.2" fill="#9d8cff" opacity="0.5"></ellipse><ellipse cx="70.5" cy="65.5" rx="4.4" ry="2.2" fill="#9d8cff" opacity="0.5"></ellipse><g class="mascot-eyes"><g><ellipse cx="36.5" cy="54" rx="10" ry="10.4" fill="#e2dbf6" opacity="0.2"></ellipse><ellipse cx="63.5" cy="54" rx="10" ry="10.4" fill="#e2dbf6" opacity="0.2"></ellipse><ellipse cx="36.5" cy="54" rx="6.4" ry="6.8" fill="#e2dbf6"></ellipse><ellipse cx="63.5" cy="54" rx="6.4" ry="6.8" fill="#e2dbf6"></ellipse><ellipse cx="34.708" cy="51.416" rx="1.92" ry="1.768" fill="#fff" opacity="0.9"></ellipse><ellipse cx="61.708" cy="51.416" rx="1.92" ry="1.768" fill="#fff" opacity="0.9"></ellipse></g></g><path d="M46.4 66q3.6 3.6 7.2 0" fill="none" stroke="#e2dbf6" stroke-width="2.2" stroke-linecap="round"></path></g></g></svg>
