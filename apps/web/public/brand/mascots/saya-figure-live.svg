<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 112 158" width="499" height="704"><style>
.saya-float{animation:saya-bob 3.6s ease-in-out infinite}
.mascot-eyes{transform-box:fill-box;transform-origin:center;animation:saya-blink 5.6s infinite}
.saya-halo{animation:saya-halo 1.8s ease-in-out infinite}
.saya-shadow{transform-box:fill-box;transform-origin:center;animation:saya-pool 3.6s ease-in-out infinite}
.saya-prism{animation:saya-prism 9s linear infinite}
.saya-spark{transform-box:fill-box;transform-origin:center;animation:saya-spark 2.4s ease-in-out infinite}
.saya-spark:nth-of-type(2){animation-delay:.8s}.saya-spark:nth-of-type(3){animation-delay:1.6s}.saya-spark:nth-of-type(4){animation-delay:1.2s}
@keyframes saya-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes saya-blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}
@keyframes saya-halo{0%,100%{opacity:.32}50%{opacity:.12}}
@keyframes saya-pool{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.82);opacity:.6}}
@keyframes saya-prism{to{filter:hue-rotate(360deg)}}
@keyframes saya-spark{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="saya-R0g"><stop offset="0" stop-color="#9d8cff" stop-opacity="0.7"></stop><stop offset="1" stop-color="#9d8cff" stop-opacity="0"></stop></radialGradient><radialGradient id="saya-R0s"><stop offset="0" stop-color="#9d8cff" stop-opacity="0.45"></stop><stop offset="1" stop-color="#9d8cff" stop-opacity="0"></stop></radialGradient></defs><g class="saya-float"><ellipse class="saya-shadow" cx="50" cy="140" rx="40" ry="6.5" fill="url(#saya-R0s)"></ellipse><g transform="translate(-10 22) scale(1.2)"><g class="saya-head"><ellipse class="saya-halo" opacity="0.32" cx="50" cy="52" rx="46" ry="44" fill="url(#saya-R0g)"></ellipse><path d="M22 74V46A28 28 0 0 1 78 46V74A9.333 9.333 0 0 1 59.333 74A9.333 9.333 0 0 1 40.667 74A9.333 9.333 0 0 1 22 74Z" fill="#6b59d6" transform="translate(0 6)"></path><path d="M22 74V46A28 28 0 0 1 78 46V74A9.333 9.333 0 0 1 59.333 74A9.333 9.333 0 0 1 40.667 74A9.333 9.333 0 0 1 22 74Z" fill="#9d8cff"></path><rect x="30" y="40" width="40" height="20" rx="10" fill="#17141f"></rect><g class="mascot-eyes"><g><path d="M38.41 48a2.5 2.5 0 0 1 5 0v4a2.5 2.5 0 0 1 -5 0ZM56.59 48a2.5 2.5 0 0 1 5 0v4a2.5 2.5 0 0 1 -5 0Z" fill="#ece8ff"></path></g></g></g></g></g></svg>
