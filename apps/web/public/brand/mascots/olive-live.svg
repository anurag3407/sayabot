<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 112 116" width="494" height="512"><style>
.saya-float{animation:saya-bob 3.6s ease-in-out infinite}
.mascot-eyes{transform-box:fill-box;transform-origin:center;animation:saya-blink 5.6s infinite}
.saya-halo{animation:saya-halo 1.8s ease-in-out infinite}
.saya-shadow{transform-box:fill-box;transform-origin:center;animation:saya-pool 3.6s ease-in-out infinite}
.saya-prism{animation:saya-prism 9s linear infinite}
.saya-spark{transform-box:fill-box;transform-origin:center;animation:saya-spark 2.4s ease-in-out infinite}
.saya-spark:nth-of-type(2){animation-delay:.8s}.saya-spark:nth-of-type(3){animation-delay:1.6s}.saya-spark:nth-of-type(4){animation-delay:1.2s}
@keyframes saya-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes saya-blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}
@keyframes saya-halo{0%,100%{opacity:.32}50%{opacity:.12}}
@keyframes saya-pool{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.82);opacity:.6}}
@keyframes saya-prism{to{filter:hue-rotate(360deg)}}
@keyframes saya-spark{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="olive-R0g"><stop offset="0" stop-color="#4fcdb0" stop-opacity="0.7"></stop><stop offset="1" stop-color="#4fcdb0" stop-opacity="0"></stop></radialGradient><radialGradient id="olive-R0s"><stop offset="0" stop-color="#4fcdb0" stop-opacity="0.45"></stop><stop offset="1" stop-color="#4fcdb0" stop-opacity="0"></stop></radialGradient></defs><g class="saya-float"><ellipse class="saya-shadow" cx="50" cy="97" rx="40" ry="6.5" fill="url(#olive-R0s)"></ellipse><g class="saya-head"><ellipse class="saya-halo" opacity="0.32" cx="50" cy="52" rx="46" ry="44" fill="url(#olive-R0g)"></ellipse><path d="M23 57A27 27 0 1 1 77 57A27 27 0 1 1 23 57ZM50 32C50 21 58 13 71 13C71 25 62 32 50 32ZM50 32C40 32 33 27 33 18C43 18 49 24 50 32Z" fill="#2b9d84" transform="translate(0 6)"></path><path d="M23 57A27 27 0 1 1 77 57A27 27 0 1 1 23 57ZM50 32C50 21 58 13 71 13C71 25 62 32 50 32ZM50 32C40 32 33 27 33 18C43 18 49 24 50 32Z" fill="#4fcdb0"></path><rect x="30" y="52" width="40" height="20" rx="10" fill="#17141f"></rect><g class="mascot-eyes"><g><path d="M38.41 60a2.5 2.5 0 0 1 5 0v4a2.5 2.5 0 0 1 -5 0ZM56.59 60a2.5 2.5 0 0 1 5 0v4a2.5 2.5 0 0 1 -5 0Z" fill="#dcf8f0"></path></g></g></g></g></svg>
