<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 112 116" width="494" height="512"><style>
.saya-float{animation:saya-bob 3.6s ease-in-out infinite}
.mascot-eyes{transform-box:fill-box;transform-origin:center;animation:saya-blink 5.6s infinite}
.saya-halo{animation:saya-halo 1.8s ease-in-out infinite}
.saya-shadow{transform-box:fill-box;transform-origin:center;animation:saya-pool 3.6s ease-in-out infinite}
.saya-prism{animation:saya-prism 9s linear infinite}
.saya-spark{transform-box:fill-box;transform-origin:center;animation:saya-spark 2.4s ease-in-out infinite}
.saya-spark:nth-of-type(2){animation-delay:.8s}.saya-spark:nth-of-type(3){animation-delay:1.6s}.saya-spark:nth-of-type(4){animation-delay:1.2s}
@keyframes saya-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes saya-blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}
@keyframes saya-halo{0%,100%{opacity:.32}50%{opacity:.12}}
@keyframes saya-pool{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.82);opacity:.6}}
@keyframes saya-prism{to{filter:hue-rotate(360deg)}}
@keyframes saya-spark{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="pip-R0g"><stop offset="0" stop-color="#f2c14e" stop-opacity="0.7"></stop><stop offset="1" stop-color="#f2c14e" stop-opacity="0"></stop></radialGradient><radialGradient id="pip-R0s"><stop offset="0" stop-color="#f2c14e" stop-opacity="0.45"></stop><stop offset="1" stop-color="#f2c14e" stop-opacity="0"></stop></radialGradient></defs><g class="saya-float"><ellipse class="saya-shadow" cx="50" cy="97" rx="40" ry="6.5" fill="url(#pip-R0s)"></ellipse><g class="saya-head"><ellipse class="saya-halo" opacity="0.32" cx="50" cy="52" rx="46" ry="44" fill="url(#pip-R0g)"></ellipse><path d="M21 55A29 29 0 1 1 79 55A29 29 0 1 1 21 55ZM28 42L23.5 19Q23 14.5 27 16.5L45 28ZM72 42L55 28L73 16.5Q77 14.5 76.5 19Z" fill="#c39024" transform="translate(0 6)"></path><path d="M21 55A29 29 0 1 1 79 55A29 29 0 1 1 21 55ZM28 42L23.5 19Q23 14.5 27 16.5L45 28ZM72 42L55 28L73 16.5Q77 14.5 76.5 19Z" fill="#f2c14e"></path><rect x="30" y="47" width="40" height="20" rx="10" fill="#17141f"></rect><g class="mascot-eyes"><g><path d="M38.41 55a2.5 2.5 0 0 1 5 0v4a2.5 2.5 0 0 1 -5 0ZM56.59 55a2.5 2.5 0 0 1 5 0v4a2.5 2.5 0 0 1 -5 0Z" fill="#fff4d6"></path></g></g></g></g></svg>
