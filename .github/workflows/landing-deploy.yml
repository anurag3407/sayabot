name: Deploy Landing to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/landing-deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Landing Page to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static landing export
        env:
          NEXT_PUBLIC_SITE_URL: "https://bot.sayalabs.in"
          NEXT_PUBLIC_APP_URL: "https://sayabot.sayalabs.in"
        run: |
          pnpm --filter @sayabot/landing build || pnpm --filter @sayabot/landing build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler pages deploy apps/landing/out \
            --project-name=sayabot \
            --branch=main \
            --commit-hash="${{ github.sha }}" \
            --commit-message="${{ github.event.head_commit.message || 'Auto-deploy from push' }}"
