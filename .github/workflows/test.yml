name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-integration:
    name: Unit + integration (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm typecheck:e2e

  e2e-smoke:
    name: E2E smoke (Playwright, API + navigation)
    runs-on: ubuntu-latest
    needs: unit-integration
    if: github.event_name == 'push'
    env:
      DATABASE_URL: postgres://u:p@localhost:5432/db
      SAYABOT_KEK: ci-test-kek
      MESH_KEK: ci-test-kek
      SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-test-service-role
      ORCHESTRATOR_INTERNAL_SECRET: ci-test-internal-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start web service (smoke lane tests web routes and API guards)
        run: |
          pnpm --filter @sayabot/web build
          pnpm --filter @sayabot/web start > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "Web service is healthy!"
              break
            fi
            echo "Waiting for web service to be healthy... ($i/30)"
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health || (cat /tmp/web.log; exit 1)
      - run: pnpm test:e2e:api
        continue-on-error: true
