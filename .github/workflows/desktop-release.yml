name: Desktop Release

# Builds the Mac app and the Windows app and publishes them as the latest GitHub release.
# The website's download buttons and the in-app update check (/api/version → latestDesktopVersion)
# read that release: Sayabot-<arch>.dmg, Sayabot-Setup-<arch>.exe, and Sayabot-win-<arch>.zip.
#
# Version: <major>.<minor> from apps/desktop/package.json + the workflow run number, so every
# release is newer than the last and installed apps are told to update.
#
# Signing: ad-hoc for now (apps/desktop/build/adhoc-sign.cjs). Once the Apple Developer ID
# secrets exist, see docs/macos-signing-and-notarization.md to sign and notarize here.

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build DMGs and publish release
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Pick version
        id: version
        working-directory: apps/desktop
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          version="${base}.${GITHUB_RUN_NUMBER}"
          pnpm pkg set version="$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Sayabot $version"

      - name: Build app
        working-directory: apps/desktop
        run: pnpm build

      - name: Package DMGs (arm64 + x64)
        working-directory: apps/desktop
        env:
          # No Developer ID yet: stop electron-builder hunting the keychain for one.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm exec electron-builder --mac dmg --arm64 --publish never
          pnpm exec electron-builder --mac dmg --x64 --publish never

      - name: Verify signatures
        working-directory: apps/desktop/dist/installers
        run: |
          for app in mac-arm64/Sayabot.app mac/Sayabot.app; do
            codesign --verify --deep --strict "$app"
            echo "$app: signature valid"
          done
          ls -la *.dmg

      - name: Publish release
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"
          dir=apps/desktop/dist/installers

          # Android APKs live in the same "latest" release; carry them over from recent releases so links never break.
          mkdir -p carry
          for r in $(gh release list --limit 5 --json tagName -q '.[].tagName'); do
            gh release download "$r" --pattern "*.apk" --dir carry 2>/dev/null || true
          done

          # Also check if mobile app.json defines a version and if an APK for that version exists
          mobile_ver=$(node -p "require('./apps/mobile/app.json').expo.version" 2>/dev/null || true)
          if [ -n "$mobile_ver" ] && [ ! -f "carry/Sayabot-$mobile_ver.apk" ]; then
            for r in $(gh release list --limit 10 --json tagName -q '.[].tagName'); do
              gh release download "$r" --pattern "Sayabot-$mobile_ver.apk" --dir carry 2>/dev/null || true
              [ -f "carry/Sayabot-$mobile_ver.apk" ] && break
            done
          fi

          # Ensure Sayabot.apk is always a copy of the highest-versioned APK
          latest_apk=$(ls -v carry/Sayabot-*.apk 2>/dev/null | grep -E 'Sayabot-[0-9]+\.[0-9]+\.[0-9]+\.apk' | tail -n 1)
          if [ -n "$latest_apk" ]; then
            cp "$latest_apk" carry/Sayabot.apk
            echo "Latest APK carried over: $latest_apk as Sayabot.apk"
          fi

          notes="Sayabot for Mac ${version}

          Built from ${GITHUB_SHA::7}.

          Install from Terminal so macOS opens Sayabot directly:

          curl -fsSL https://sayabot.sayalabs.in/install-mac.sh | bash

          A DMG saved in the browser is checked by macOS. Click Done, then System Settings → Privacy & Security → Open Anyway."

          shopt -s nullglob
          files=("$dir/Sayabot-arm64.dmg" "$dir/Sayabot-x64.dmg" carry/*.apk)

          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-run of the same workflow run: replace the files instead of failing.
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --latest
          else
            gh release create "$tag" "${files[@]}" \
              --title "Sayabot ${version}" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              --latest
          fi

  build-windows:
    name: Build Windows installers and attach them
    needs: build-and-release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Pin the same version as the Mac release
        working-directory: apps/desktop
        shell: bash
        run: pnpm pkg set version="${{ needs.build-and-release.outputs.version }}"

      - name: Package NSIS and zip (x64 + arm64)
        working-directory: apps/desktop
        shell: bash
        run: |
          pnpm build
          node scripts/make-ico.mjs
          pnpm exec electron-builder --win nsis zip --x64 --publish never
          pnpm exec electron-builder --win nsis zip --arm64 --publish never
          ls -la dist/installers

      - name: Upload to the release
        shell: bash
        run: |
          version="${{ needs.build-and-release.outputs.version }}"
          tag="v${version}"
          dir=apps/desktop/dist/installers
          shopt -s nullglob
          files=("$dir"/Sayabot-Setup-*.exe "$dir"/Sayabot-win-*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Windows artifacts were produced." >&2
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber
