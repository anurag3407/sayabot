name: Deploy to Lightsail

# Deploy only after the Tests workflow passes on main (or by hand).
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lightsail
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy on Lightsail
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: Trigger Build & Rollout on Lightsail VPS
        env:
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_USER: ${{ secrets.LIGHTSAIL_USER }}
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_PORT: ${{ secrets.LIGHTSAIL_PORT }}
          # Deploy exactly the commit the Tests workflow verified, not whatever main is now.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -e
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "ERROR: Required SSH secrets (LIGHTSAIL_HOST, LIGHTSAIL_USER, LIGHTSAIL_SSH_KEY) are missing!" >&2
            exit 1
          fi

          PORT="${SSH_PORT:-22}"
          [ -z "$PORT" ] && PORT=22

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Cleanly write deploy private key and clean up on exit
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT

          echo "==> Connecting via native OpenSSH to $SSH_USER@$SSH_HOST:$PORT..."
          ssh -i ~/.ssh/deploy_key \
              -p "$PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=60 \
              -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" "bash -se -- $DEPLOY_SHA" << 'EOF'
            set -e
            echo "==> Starting deploy on Lightsail VPS ($(uname -n))..."
            
            # Support both legacy $HOME/mesh and new $HOME/sayabot, migrating if needed
            TARGET_DIR="$HOME/sayabot"
            if [ ! -d "$TARGET_DIR" ] && [ -d "$HOME/mesh" ]; then
              echo "==> Migrating existing checkout from $HOME/mesh to $TARGET_DIR..."
              mv "$HOME/mesh" "$TARGET_DIR"
            fi

            if [ ! -d "$TARGET_DIR" ]; then
              echo "==> Cloning repository into $TARGET_DIR..."
              git clone https://github.com/anurag3407/sayabot.git "$TARGET_DIR"
            fi
            
            cd "$TARGET_DIR"
            echo "==> Fetching latest changes from origin/main..."
            git fetch origin main
            git reset --hard "${1:-origin/main}"
            echo "==> Deploying $(git rev-parse --short=12 HEAD)"
            
            echo "==> Checking required deploy files..."
            if [ ! -f "deploy/.env.production" ]; then
              echo "ERROR: deploy/.env.production is missing on the server!" >&2
              exit 1
            fi
            
            echo "==> Running VPS build, migrations & health rollout..."
            ./deploy/deploy.sh
          EOF
          echo "==> Deployment completed successfully!"
