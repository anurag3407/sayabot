# Sayabot production stack for a single VPS.
#
#   internet ─▶ nginx :80/:443 ─┬─▶ web :3000            (pages, server actions, /api/v1 bot+MCP proxy)
#                               └─▶ orchestrator :4000   (/collab canvas WebSocket only)
#   web ─▶ orchestrator (internal HTTP)     both ─▶ Supabase (Postgres, Auth, Realtime)
#
# Only nginx publishes ports. Run through deploy/deploy.sh, which passes
#   --env-file deploy/.env.production -f deploy/docker-compose.yml

name: sayabot

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardening: &hardening
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging
  networks:
    - sayabot

x-orchestrator-image: &orchestrator-image
  image: ${SAYABOT_IMAGE_PREFIX:-${MESH_IMAGE_PREFIX:-sayabot}}/orchestrator:${SAYABOT_TAG:-${MESH_TAG:-latest}}

services:
  web:
    <<: *hardening
    image: ${SAYABOT_IMAGE_PREFIX:-${MESH_IMAGE_PREFIX:-sayabot}}/web:${SAYABOT_TAG:-${MESH_TAG:-latest}}
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: https://${SAYABOT_DOMAIN:-${MESH_DOMAIN:?set SAYABOT_DOMAIN}}
        NEXT_PUBLIC_COLLAB_URL: wss://${SAYABOT_DOMAIN:-${MESH_DOMAIN}}/collab
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_GITHUB_AUTH_ENABLED: ${NEXT_PUBLIC_GITHUB_AUTH_ENABLED:-false}
        NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-false}
        NEXT_PUBLIC_SSO_ENABLED: ${NEXT_PUBLIC_SSO_ENABLED:-false}
        GIT_COMMIT_SHA: ${SAYABOT_TAG:-${MESH_TAG:-unknown}}
    env_file: .env.production
    environment:
      NODE_ENV: production
      # Derived from SAYABOT_DOMAIN so the browser, auth redirects and canvas agree.
      NEXT_PUBLIC_SITE_URL: https://${SAYABOT_DOMAIN:-${MESH_DOMAIN}}
      NEXT_PUBLIC_APP_URL: https://${SAYABOT_DOMAIN:-${MESH_DOMAIN}}
      NEXT_PUBLIC_COLLAB_URL: wss://${SAYABOT_DOMAIN:-${MESH_DOMAIN}}/collab
      ORCHESTRATOR_URL: http://orchestrator:4000
      COMPUTERD_URL: http://computerd:4100
      GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-false}
      GITHUB_AUTH_ENABLED: ${NEXT_PUBLIC_GITHUB_AUTH_ENABLED:-false}
      SSO_ENABLED: ${NEXT_PUBLIC_SSO_ENABLED:-false}
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000
    depends_on:
      orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${SAYABOT_WEB_MEMORY:-${MESH_WEB_MEMORY:-1g}}
    stop_grace_period: 20s

  orchestrator:
    <<: [*hardening, *orchestrator-image]
    build:
      context: ..
      dockerfile: deploy/docker/orchestrator.Dockerfile
      args:
        GIT_COMMIT_SHA: ${SAYABOT_TAG:-${MESH_TAG:-unknown}}
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "4000"
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      COMPUTERD_URL: http://computerd:4100
      EGRESS_URL: http://egress:8081
      EGRESS_PROXY_URL: http://egress:8080
      # Webhooks to private networks are a dev-only escape hatch.
      SAYABOT_ALLOW_PRIVATE_WEBHOOKS: ${SAYABOT_ALLOW_PRIVATE_WEBHOOKS:-${MESH_ALLOW_PRIVATE_WEBHOOKS:-false}}
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: ${SAYABOT_ORCHESTRATOR_MEMORY:-${MESH_ORCHESTRATOR_MEMORY:-1g}}
    # Gives pg-boss and Hocuspocus time to finish jobs and flush canvases on SIGTERM.
    stop_grace_period: 30s

  # One-off tasks: `deploy.sh migrate` / `deploy.sh seed`. Never started by `up`.
  migrate:
    <<: [*hardening, *orchestrator-image]
    profiles: ["tools"]
    restart: "no"
    env_file: .env.production
    working_dir: /app/packages/db
    command: ["node", "--import", "tsx", "src/migrate.ts"]
    read_only: true
    tmpfs:
      - /tmp

  nginx:
    image: nginx:${NGINX_VERSION:-1.28-alpine}
    restart: unless-stopped
    logging: *logging
    networks:
      - sayabot
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      SAYABOT_DOMAIN: ${SAYABOT_DOMAIN:-${MESH_DOMAIN}}
      MESH_DOMAIN: ${SAYABOT_DOMAIN:-${MESH_DOMAIN}}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/snippets/sayabot-locations.conf:/etc/nginx/snippets/sayabot-locations.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
    # Reload every 6h so renewed certificates are picked up without downtime.
    command: ["/bin/sh", "-c", "/docker-entrypoint.d/20-envsubst-on-templates.sh && rm -f /etc/nginx/conf.d/default.conf && (while :; do sleep 6h & wait $${!}; nginx -s reload; done &) && exec nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk -H \"Host: $${SAYABOT_DOMAIN:-$${MESH_DOMAIN}}\" https://127.0.0.1/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  certbot:
    image: certbot/certbot:${CERTBOT_VERSION:-v4.1.1}
    restart: unless-stopped
    logging: *logging
    networks:
      - sayabot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

  computerd:
    <<: *hardening
    user: "0:0"
    image: ${SAYABOT_IMAGE_PREFIX:-${MESH_IMAGE_PREFIX:-sayabot}}/computerd:${SAYABOT_TAG:-${MESH_TAG:-latest}}
    build:
      context: ..
      dockerfile: deploy/docker/computerd.Dockerfile
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "4100"
      DOCKER_HOST: "unix:///var/run/docker.sock"
      ORCHESTRATOR_URL: http://orchestrator:4000
      EGRESS_ADMIN_URL: http://egress:8081
      # agentd fast path: a private control volume instead of a network hop, so
      # computerd stays off botnet and egress remains the only dual-homed service.
      AGENTD_CTL_ROOT: /srv/saaya-agentd
      AGENTD_CTL_VOLUME: saaya-agentd
      # Capacity: "auto" sizes from Docker host memory (COMPUTER_MEM_FRACTION, default 0.6).
      COMPUTER_MAX_RUNNING: ${COMPUTER_MAX_RUNNING:-auto}
      COMPUTER_IDLE_MS: ${COMPUTER_IDLE_MS:-600000}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - saaya-agentd:/srv/saaya-agentd
    depends_on:
      orchestrator:
        condition: service_healthy

  egress:
    <<: *hardening
    image: ${SAYABOT_IMAGE_PREFIX:-${MESH_IMAGE_PREFIX:-sayabot}}/egress:${SAYABOT_TAG:-${MESH_TAG:-latest}}
    build:
      context: ..
      dockerfile: deploy/docker/egress.Dockerfile
    env_file: .env.production
    environment:
      NODE_ENV: production
      PROXY_PORT: "8080"
      ADMIN_PORT: "8081"
      ORCHESTRATOR_URL: http://orchestrator:4000
    networks:
      - sayabot
      - botnet
    read_only: true
    tmpfs:
      - /tmp

networks:
  sayabot:
    driver: bridge
  botnet:
    name: botnet
    driver: bridge
    internal: true

volumes:
  # Fixed name: computerd mounts per-computer subpaths of it into bot containers.
  saaya-agentd:
    name: saaya-agentd
