# Bundled Supabase (docker-compose.supabase.yml) on this same domain. nginx does the little
# Supabase's own API gateway did: the same public paths, the apikey → Authorization fallback,
# and realtime's admin API kept private. Each service still checks the access token itself.
# `^~` wins over the regex locations in sayabot-locations.conf (e.g. the /auth rate limit).

location ^~ /auth/v1/ {
    limit_req zone=sayabot_general burst=60 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Authorization $supabase_authorization;
    proxy_pass http://supabase-auth:9999/;
}

# PostgREST's root lists the whole API; Supabase's gateway only shows it to admins.
location = /rest/v1/ {
    return 403;
}

location ^~ /rest/v1/ {
    limit_req zone=sayabot_api burst=120 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Authorization $supabase_authorization;
    proxy_pass http://supabase-rest:3000/;
}

# Realtime's tenant admin API and its OpenAPI page stay private (as with Supabase's gateway).
location ^~ /realtime/v1/api/tenants {
    return 403;
}

location ^~ /realtime/v1/api/openapi {
    return 403;
}

# Broadcasts from the orchestrator (REST).
location ^~ /realtime/v1/api/ {
    proxy_http_version 1.1;
    proxy_set_header Host              realtime-dev.supabase-realtime;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_set_header Authorization     $supabase_authorization;
    proxy_pass http://supabase-realtime:4000/api/;
}

# Live updates for every open web, phone and Mac app (WebSocket). Realtime picks its tenant from
# the Host header, so these two locations set it instead of including proxy.conf.
location ^~ /realtime/v1/ {
    proxy_http_version 1.1;
    proxy_set_header Host              realtime-dev.supabase-realtime;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_pass http://supabase-realtime:4000/socket/;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
}

location ^~ /storage/v1/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Authorization $supabase_authorization;
    proxy_set_header X-Forwarded-Prefix /storage/v1;
    client_max_body_size 50m;
    proxy_request_buffering off;
    proxy_pass http://supabase-storage:5000/;
}
