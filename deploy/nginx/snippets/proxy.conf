# Common upstream headers. HTTP/1.1 + empty Connection enables upstream keepalive
# (and lets $connection_upgrade turn it into a WebSocket upgrade where needed).
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  443;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_connect_timeout 5s;
proxy_next_upstream   error timeout;
proxy_next_upstream_tries 2;

# Buffer sizes for upstream responses (critical for OAuth callbacks with multiple large Set-Cookie headers)
proxy_buffer_size          128k;
proxy_buffers              4 256k;
proxy_busy_buffers_size    256k;
