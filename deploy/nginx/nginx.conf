# Main nginx config for the Sayabot edge proxy. Site config lives in templates/
# (rendered to /etc/nginx/conf.d by the official image's envsubst step).

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
pid        /run/nginx.pid;
error_log  /dev/stderr warn;

events {
    worker_connections  8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access logs on stdout; Docker rotates them (see compose logging).
    # Bot/MCP keys can travel in the URL path (/mcp/<key>, /api/v1/mcp/<key>), so mask them in logs.
    map $request_uri $loggable_uri {
        ~^(?<prefix>(/api/v1)?/mcp/)(?:mesh_ak_|sayabot_ak_)  "${prefix}[redacted]";
        default                            $request_uri;
    }
    log_format json_safe escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$loggable_uri","status":$status,'
        '"bytes":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time",'
        '"ua":"$http_user_agent","host":"$host"}';
    access_log /dev/stdout json_safe;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout  65s;
    keepalive_requests 1000;
    types_hash_max_size 4096;
    server_names_hash_bucket_size 128;

    client_max_body_size     4m;
    client_body_timeout      30s;
    client_header_timeout    15s;
    send_timeout             60s;
    large_client_header_buffers 4 32k;

    proxy_connect_timeout    5s;
    proxy_send_timeout       60s;
    proxy_read_timeout       60s;
    proxy_buffer_size        128k;
    proxy_buffers            4 256k;
    proxy_busy_buffers_size  256k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml application/manifest+json
               image/svg+xml font/woff2;

    # TLS (Mozilla "intermediate"). Let's Encrypt no longer serves OCSP, so no stapling.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SayabotTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Abuse protection. Keys are per client IP.
    limit_req_zone  $binary_remote_addr zone=sayabot_general:20m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=sayabot_api:20m     rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=sayabot_auth:10m    rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=sayabot_conn:20m;
    limit_req_status  429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Docker's embedded DNS, so upstreams resolve after container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
