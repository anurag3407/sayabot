# Cloudflare Tunnel overlay. deploy.sh adds it when CLOUDFLARE_TUNNEL_TOKEN is set:
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml ...
#
# nginx publishes nothing and serves plain HTTP on the internal :8080; cloudflared dials out to
# Cloudflare and forwards https://MESH_DOMAIN to it. certbot is not used.
#
# In the Cloudflare dashboard (Zero Trust → Networks → Tunnels → your tunnel → Public Hostname):
#   MESH_DOMAIN  →  Service: HTTP  →  URL: nginx:8080
# WebSockets (/collab) work through the tunnel with no extra settings.

services:
  nginx:
    ports: !reset []
    volumes: !override
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates-tunnel:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.10.0}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - mesh
    depends_on:
      nginx:
        condition: service_healthy
